<title id="title">shiruviaa kitsune</title>
<desc id="desc">A white kitsune mask with pink markings in front of nine swaying pink and violet tails.</desc>
<style>
  .tw { animation: tw 4.8s ease-in-out infinite; }
  .spk { animation: spk 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
